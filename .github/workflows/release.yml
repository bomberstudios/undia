name: Release

# Every push to main builds a signed APK and publishes it as a GitHub release, versioned
# 0.0.<run number>. "Run workflow" (workflow_dispatch) builds and signs the same APK but only
# attaches it to the run.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        env:
          VERSION_NAME: 0.0.${{ github.run_number }}
          STORE_FILE: ${{ runner.temp }}/release.p12
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "undia-0.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: undia-release-apk
          path: undia-*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.0.${{ github.run_number }}" undia-*.apk \
            --target "$GITHUB_SHA" --title "v0.0.${{ github.run_number }}" --generate-notes
