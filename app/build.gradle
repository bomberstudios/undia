plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.naranjanaranja.undia'
    compileSdk 36

    defaultConfig {
        applicationId "org.naranjanaranja.undia"
        minSdk 26
        targetSdk 36
        // CI sets these: the VERSION file plus the commit hash, and the run number (always going up)
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: (rootProject.file('VERSION').text.trim() + '-dev')
        // Shown in About; CI passes the date of the run
        buildConfigField 'String', 'BUILD_DATE', '"' + (System.getenv('BUILD_DATE') ?: new Date().format('yyyy-MM-dd')) + '"'
        // Boox tablets are arm64
        // Symbol tables for the native libraries (Onyx's), so Play can read their crash reports
        ndk {
            abiFilters 'arm64-v8a'
            debugSymbolLevel 'SYMBOL_TABLE'
        }
    }

    // Release signing comes from the environment (CI, or a local shell); without it a local
    // release build falls back to the debug key so it still builds.
    signingConfigs {
        release {
            def storePath = System.getenv('STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    packagingOptions {
        // onyxsdk-pen and mmkv both ship libc++_shared.so
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation('com.onyx.android.sdk:onyxsdk-device:1.3.6') {
        exclude group: 'com.android.support', module: 'support-compat'
    }
    implementation('com.onyx.android.sdk:onyxsdk-pen:1.5.8') {
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support', module: 'appcompat-v7'
    }
    implementation('com.onyx.android.sdk:onyxsdk-base:1.8.9') {
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support', module: 'appcompat-v7'
    }
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    testImplementation 'junit:junit:4.13.2'
}
