plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// SMTP login for "Email PDF to me", read from the git-ignored local.properties:
//   smtp.user=you@gmail.com
//   smtp.password=<Gmail app password>
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def buildConfigString = { String key -> '"' + localProps.getProperty(key, '').replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'dev.sketch'
    compileSdk 35

    defaultConfig {
        applicationId "dev.sketch"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Boox tablets are arm64
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'SMTP_USER', buildConfigString('smtp.user')
        buildConfigField 'String', 'SMTP_PASSWORD', buildConfigString('smtp.password')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    packagingOptions {
        // onyxsdk-pen and mmkv both ship libc++_shared.so
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.print:print:1.0.0'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    implementation('com.onyx.android.sdk:onyxsdk-device:1.3.1.3') {
        exclude group: 'com.android.support', module: 'support-compat'
    }
    // newest 1.5.0.4 needs onyxsdk-geometry, which isn't published
    implementation('com.onyx.android.sdk:onyxsdk-pen:1.4.12.1') {
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support', module: 'appcompat-v7'
    }
    implementation('com.onyx.android.sdk:onyxsdk-base:1.8.2.1') {
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support', module: 'appcompat-v7'
    }
    // The Onyx SDK calls hidden APIs
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
}
