plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.sketch'
    compileSdk 35

    defaultConfig {
        applicationId "dev.sketch"
        minSdk 29
        targetSdk 34
        // CI sets these: the VERSION file plus the commit hash, and the run number (always going up)
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '0.0.1'
        // Boox tablets are arm64
        ndk { abiFilters 'arm64-v8a' }
    }

    // Release signing comes from the environment (CI, or a local shell); without it a local
    // release build falls back to the debug key so it still builds.
    signingConfigs {
        release {
            def storePath = System.getenv('STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions {
        // onyxsdk-pen and mmkv both ship libc++_shared.so
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.print:print:1.0.0'
    implementation('com.onyx.android.sdk:onyxsdk-device:1.3.1.3') {
        exclude group: 'com.android.support', module: 'support-compat'
    }
    // newest 1.5.0.4 needs onyxsdk-geometry, which isn't published
    implementation('com.onyx.android.sdk:onyxsdk-pen:1.4.12.1') {
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support', module: 'appcompat-v7'
    }
    implementation('com.onyx.android.sdk:onyxsdk-base:1.8.2.1') {
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support', module: 'appcompat-v7'
    }
    // The Onyx SDK calls hidden APIs
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
}
